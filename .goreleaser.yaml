# nemo's binaries, archives, packages and Homebrew formula, for each release that
# release-please creates. gill's image is built by the release workflow.
version: 2

project_name: nemo

builds:
  - id: nemo
    main: ./cmd/nemo
    binary: nemo
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.stamped={{ .Version }}

archives:
  - id: nemo
    name_template: "nemo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# deb, rpm and apk packages of the Linux binaries, attached to the release.
nfpms:
  - id: nemo
    package_name: nemo
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Sentiens
    homepage: https://github.com/sntns/nemo
    maintainer: Sentiens <security@sentiens.fr>
    description: Deploy applications of containers onto Docker, with Compose or Swarm, as CNAB bundles
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin

# An SPDX SBOM of each archive.
sboms:
  - artifacts: archive

# The checksums signed by Sigstore, keyless: the bundle holds the signature
# and the certificate of the release workflow's identity.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

# release-please writes the notes and creates the release; the archives are
# added to it.
changelog:
  disable: true

release:
  mode: keep-existing
  # A release whose job failed half way can be run again.
  replace_existing_artifacts: true

# shortcut: brews is deprecated in GoReleaser v2 in favour of casks, which do
# not install on Linux; move to homebrew_casks when they do.
brews:
  - name: nemo
    repository:
      owner: sntns
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/sntns/nemo
    description: Deploy applications of containers onto Docker, with Compose or Swarm, as CNAB bundles
    license: Apache-2.0
    test: |
      system "#{bin}/nemo", "--version"

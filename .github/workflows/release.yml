name: Release

# release-please keeps a release pull request up to date with the changes on
# main. Merging it tags the version and creates the release; then nemo's
# binaries, packages, SBOMs and signed checksums are added to it, with their
# provenance attestations; its formula is pushed to sntns/homebrew-tap; and
# gill's image is pushed to ghcr.io with the same version, its SBOM, and its
# provenance signed.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A token of a person, so that the release pull request runs the CI:
          # GitHub runs no workflow for what GitHub Actions' own token creates.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  nemo:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # Docker's reusable workflow, as the CI's: one build per platform on its own
  # runner, then the image assembled, pushed, and its attestations signed.
  gill:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      sbom: true
      context: .
      file: build/gill/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: gill
      set-meta-annotations: true
      meta-images: ghcr.io/${{ github.repository_owner }}/gill
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

name: CI

# Pull requests, main and a weekly run, in three stages, each once the
# previous one passed: the static checks, then the tests, then what a release
# publishes. The label ci/validate-only keeps a pull request to the static
# checks. The CI job alone is required.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15

  reference:
    name: Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check that the reference of the commands is up to date
        run: |
          make reference
          git diff --exit-code docs/reference/cli || (echo "::error::run make reference and commit docs/reference/cli" && exit 1)

  govulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    env:
      # Space-separated, each with why. GO-2026-6941: github.com/qri-io/jsonschema, which cnab-go validates a bundle's
      # parameters with, has no fixed version, cnab-go's latest included. Remove it once one exists.
      IGNORED: GO-2026-6941
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go of go.mod, so that the scan covers the standard library the release is built with.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Fail on a vulnerability the code reaches, but those ignored
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./... || true
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format json ./... > govulncheck.json
          reached=$(jq -r 'select(.finding.trace[0].function) | .finding.osv' govulncheck.json | sort -u)
          left=$(comm -23 <(echo "$reached") <(tr ' ' '\n' <<< "$IGNORED" | sort -u) | sed '/^$/d')
          if [ -n "$left" ]; then
            echo "::error::the code reaches $(echo $left)"
            exit 1
          fi
          echo "the code reaches no vulnerability but those ignored: $IGNORED"

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  test:
    name: Unit tests
    needs: [lint, reference, govulncheck, workflows]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  integration:
    name: Integration tests
    needs: [lint, reference, govulncheck, workflows]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci/validate-only') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker swarm init
      - run: make integration

  binaries:
    name: Binaries
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build nemo and its packages for every platform it is released for
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,publish

  # One build per platform on its own runner, then a job that assembles the
  # image: Docker's reusable workflow, as moby and buildx build theirs. The
  # release runs the same one, pushing and signing.
  image:
    name: Image
    needs: [test, integration]
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: false
      context: .
      file: build/gill/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: gill
      meta-images: ghcr.io/sntns/gill

  ci:
    name: CI
    needs: [lint, reference, govulncheck, workflows, test, integration, binaries, image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was left out by ci/validate-only
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "CI passed"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build nemo for every platform it is released for
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - name: Check that the reference of the commands is up to date
        run: |
          make reference
          git diff --exit-code docs/reference/cli || (echo "::error::run make reference and commit docs/reference/cli" && exit 1)
      - uses: docker/setup-buildx-action@v4
      - name: Build gill
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/gill/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: false
